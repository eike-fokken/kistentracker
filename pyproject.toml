[project]
name = "dbtrials"
version = "0.1.0"
description = "Trial for web development with vibe coding"
authors = [
    {name = "Eike Fokken",email = "eike.fokken@de.abb.com"}
]
requires-python = ">=3.13,<3.14.0"

dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "django-ninja (>=1.6.2,<2.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-ninja-jwt (>=5.4.4,<6.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy] (>=6.0.6,<7.0.0)",
    # No extras on purpose: ruff does the linting (E/W/F/I/D) and the
    # formatting, so pylsp's bundled autopep8, flake8, pycodestyle, pyflakes,
    # mccabe, pydocstyle, pylint, rope and yapf are not installed. Plugins
    # whose import needs one of them fail to load and pylsp blocks them on
    # start. See [tool.pylsp] below for the ones that survive that and have
    # to be switched off explicitly.
    "python-lsp-server (>=1.14.0,<2.0.0)",
    "pylsp-mypy (>=0.7.3,<0.8.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "pylint-django (>=2.7.0,<3.0.0)",
    "python-lsp-ruff (>=2.3.4,<3.0.0)",
]

# pylsp settings, read by tools/start-pylsp.py and handed to the server as LSP
# `initializationOptions`. pylsp has no way to read these from a TOML file
# itself -- only plugins such as pylsp-ruff and pylsp-mypy read pyproject.toml
# on their own. Living here instead of in a .pylsp.json keeps every Python tool
# configured in one file.
[tool.pylsp]

# python-lsp-ruff already disables pyflakes, mccabe, pycodestyle, yapf and
# autopep8 by itself. pydocstyle and pylint are not covered:

# - pylint is installed as the CI linter, but pylsp disables its plugin by
#   default. It is switched on deliberately below so the editor also reports
#   the Django-specific findings from pylint-django, which ruff does not
#   cover. [tool.pylint] is picked up by pylint itself from the workspace
#   root, so the editor and CI agree on rules and ignore-paths.
[tool.pylsp.plugins]
pydocstyle = { enabled = false }
pylint = { enabled = true }

# pylsp has no separate config for it: the hover-signature formatter is read
# from `signature` at the top level. "ruff" keeps it in sync with
# [tool.ruff]'s line-length instead of formatting previews with black.
[tool.pylsp.signature]
formatter = "ruff"
line_length = 88

[tool.mypy]
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
mypy_path = "dbtrials"

check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = ["type-abstract"]

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = true


[tool.django-stubs]
django_settings_module = "dbtrials.settings"

[tool.ruff]
line-length = 88
target-version = "py313"

# Migrations are generated by `makemigrations`, so no tool lints or formats
# them. This applies to `ruff check` and `ruff format` alike. `force-exclude`
# makes the rule hold even for files passed to ruff explicitly, rather than
# only when a whole directory is walked.
extend-exclude = ["*/migrations/*"]
force-exclude = true

[tool.ruff.lint]
# Linters:
#   E, W  - pycodestyle           (was: flake8)
#   F     - pyflakes              (was: flake8)
#   I     - isort                 (was: isort --profile black)#   D     - pydocstyle            (was: pydocstyle)
select = ["E", "W", "F", "I", "D"]

# Kept at the ignores the project already had before the switch to ruff, so
# that the migration introduces no new findings. E501 is no longer part of
# ruff's E/W selection (it lives in E5), but is listed to document the intent.
extend-ignore = [
    "E203",  # whitespace before ':' (conflicts with ruff format)
    "E265",  # block comment should start with '# '
    "E266",  # too many leading '#' for block comment
    "E501",  # line too long
    "D100",  # missing docstring in public module
    "D101",  # missing docstring in public class
    "D102",  # missing docstring in public method
    "D103",  # missing docstring in public function
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
    "D200",  # one-line docstring should fit on one line
    "D202",  # no blank lines allowed after function docstring
]

[tool.ruff.lint.pydocstyle]
# Match the pydocstyle default; ruff's own default (numpy) would report many
# extra findings.
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pylint]
load-plugins = ["pylint_django"]
django-settings-module = "dbtrials.settings"
ignore-paths = ["^.*/migrations/.*$", "^.*/tests/.*$"]

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "missing-module-docstring",
    # C0302: api.py is a long module by design -- one file holding the whole
    # REST surface reads better than anagram-sized fragments split by topic.
    "too-many-lines",
    "R",
]
